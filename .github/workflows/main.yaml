name: Backend tests

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: BlogApp.Backend/BlogApp.Backend.slnx
    
    - name: Install dependencies
      run: dotnet restore BlogApp.Backend/BlogApp.Backend.slnx
    
    - name: Lint
      run: dotnet format BlogApp.Backend/BlogApp.Backend.slnx --verify-no-changes --no-restore
    
    - name: Build
      run: dotnet build BlogApp.Backend/BlogApp.Backend.slnx --no-restore
    
    - name: Run tests
      run: dotnet test BlogApp.Backend/BlogApp.Backend.slnx --no-build
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Build without push
      uses: docker/build-push-action@v7
      with:
        context: BlogApp.Backend
        file: BlogApp.Backend/Dockerfile
        push: false # Only check if build succeeds and ignore build result
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to Render
      if: github.ref == 'refs/heads/main'
      env:
        DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        curl -X POST "$DEPLOY_HOOK"

    - name: Deployment health check
      if: github.ref == 'refs/heads/main'
      timeout-minutes: 10
      run: |
        URL="https://blogappweb.onrender.com/healthz"
        TIMEOUT=600
        INTERVAL=30
        ELAPSED=0
        
        while [ $ELAPSED -lt $TIMEOUT ]; do
          sleep 30

          STATUS=$(curl -s -m 5 -o /dev/null -w "%{http_code}" $URL || true)
          if [ $STATUS -eq 200 ]; then
            exit 0
          fi

          ELAPSED=$((ELAPSED + INTERVAL))
        done

        exit 1
